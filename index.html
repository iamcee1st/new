<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 임시 작성</title>
<style>
  :root{
    --bg:#f7f5f0;
    --paper:#ffffff;
    --ink:#2b2b26;
    --sub:#8a8578;
    --accent:#3d6b4f;
    --line:#e4e0d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-size:18px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .savebar{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--sub);
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:#c4c0b3;
    transition:background .2s;
  }
  .dot.saved{background:var(--accent);}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
    overflow:hidden;
  }
  input#title{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    padding:16px 18px;
    font-size:17px;
    font-weight:700;
    outline:none;
    background:transparent;
  }
  input#title::placeholder{color:#c4c0b3;font-weight:600;}
  #body{
    width:100%;
    min-height:420px;
    padding:16px 18px 20px;
    font-size:15px;
    line-height:1.75;
    outline:none;
    font-family:inherit;
    background:transparent;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #body:empty:before{
    content: attr(data-placeholder);
    color:#c4c0b3;
  }
  #body img{
    max-width:100%;
    border-radius:6px;
    margin:10px 0;
    display:block;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 18px;
    border-top:1px solid var(--line);
    background:#fbfaf7;
    font-size:12px;
    color:var(--sub);
  }
  .actions{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .primary{
    background:var(--accent);
    color:#fff;
  }
  .primary:hover{background:#325940;}
  .ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
  }
  .ghost:hover{background:#f0eee6;}
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 블로그 임시 작성</h1>
    <div class="savebar"><span class="dot" id="saveDot"></span><span id="saveStatus">불러오는 중...</span></div>
  </header>

  <div class="card">
    <input id="title" placeholder="제목을 입력하세요">
    <div id="body" contenteditable="true" data-placeholder="여기에 본문을 작성하세요. 캡처한 화면은 원하는 위치를 클릭한 뒤 Ctrl+V로 바로 붙여넣을 수 있어요."></div>
    <div class="toolbar">
      <span id="count">0자</span>
      <span>이 브라우저에 자동 저장됩니다</span>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="copyBtn">전체 복사 (이미지 포함)</button>
    <button class="ghost" id="copyTitleBtn">제목만 복사</button>
    <button class="ghost" id="copyBodyBtn">본문만 복사</button>
    <button class="ghost" id="clearBtn">내용 지우기</button>
  </div>

  <p class="hint">본문 아무 곳이나 클릭한 뒤 캡처 화면을 <b>Ctrl+V</b>로 붙여넣으면 그 위치에 이미지가 삽입됩니다. "전체 복사"를 누르면 텍스트와 이미지가 함께 복사되니, 네이버 블로그 글쓰기 화면에서 <b>Ctrl+V</b>로 붙여넣으면 이미지도 함께 들어갑니다. 저장은 이 브라우저에만 남으니 다른 PC·폰에서는 안 보여요.</p>
</div>

<div class="toast" id="toast"></div>

<script>
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const countEl = document.getElementById('count');
const saveStatusEl = document.getElementById('saveStatus');
const saveDot = document.getElementById('saveDot');
const toastEl = document.getElementById('toast');
const STORAGE_KEY = 'blog-draft-v2';

function updateCount(){
  countEl.textContent = bodyEl.innerText.replace(/\n+$/,'').length.toLocaleString() + '자';
}

let saveTimer = null;
function scheduleSave(){
  saveDot.classList.remove('saved');
  saveStatusEl.textContent = '저장 중...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 500);
}

function saveDraft(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      title: titleEl.value,
      bodyHTML: bodyEl.innerHTML,
      updatedAt: Date.now()
    }));
    saveDot.classList.add('saved');
    saveStatusEl.textContent = '저장됨';
  }catch(e){
    saveStatusEl.textContent = '저장 실패 (용량 초과 가능)';
  }
}

function loadDraft(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      titleEl.value = data.title || '';
      bodyEl.innerHTML = data.bodyHTML || '';
      updateCount();
      saveDot.classList.add('saved');
      saveStatusEl.textContent = '저장된 초안 불러옴';
    }else{
      saveStatusEl.textContent = '새 초안';
    }
  }catch(e){
    saveStatusEl.textContent = '새 초안';
  }
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1700);
}

// ---- 본문 내 이미지 삽입 ----
function insertImageAtCursor(dataUrl){
  const img = document.createElement('img');
  img.src = dataUrl;
  const sel = window.getSelection();
  let inBody = false;
  if(sel && sel.rangeCount > 0){
    const node = sel.anchorNode;
    inBody = node && bodyEl.contains(node);
  }
  if(inBody){
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    const br = document.createElement('br');
    img.after(br);
    range.setStartAfter(br);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }else{
    bodyEl.appendChild(img);
    bodyEl.appendChild(document.createElement('br'));
  }
}

bodyEl.addEventListener('paste', (e)=>{
  const items = (e.clipboardData || window.clipboardData)?.items;
  let imageFound = false;
  if(items){
    for(const item of items){
      if(item.kind === 'file' && item.type.startsWith('image/')){
        imageFound = true;
        const file = item.getAsFile();
        const reader = new FileReader();
        reader.onload = ()=>{
          insertImageAtCursor(reader.result);
          updateCount();
          scheduleSave();
          showToast('이미지 삽입됨');
        };
        reader.readAsDataURL(file);
      }
    }
  }
  if(imageFound){
    e.preventDefault();
    return;
  }
  // 일반 텍스트는 서식 없이 붙여넣기
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

bodyEl.addEventListener('input', ()=>{ updateCount(); scheduleSave(); });
titleEl.addEventListener('input', scheduleSave);

// ---- 복사 기능 (이미지 포함 리치 복사) ----
function richCopy(nodes, label){
  const temp = document.createElement('div');
  temp.contentEditable = 'true';
  temp.style.position = 'fixed';
  temp.style.left = '-9999px';
  temp.style.top = '0';
  nodes.forEach(n => temp.appendChild(n));
  document.body.appendChild(temp);

  const range = document.createRange();
  range.selectNodeContents(temp);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }

  sel.removeAllRanges();
  document.body.removeChild(temp);
  showToast(ok ? (label + ' 복사 완료') : '복사 실패, 다시 시도해주세요');
}

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const nodes = [];
  if(titleEl.value){
    const h = document.createElement('h2');
    h.textContent = titleEl.value;
    nodes.push(h);
  }
  const clone = bodyEl.cloneNode(true);
  while(clone.firstChild) nodes.push(clone.firstChild);
  richCopy(nodes, '전체');
});

document.getElementById('copyBodyBtn').addEventListener('click', ()=>{
  const clone = bodyEl.cloneNode(true);
  const nodes = [];
  while(clone.firstChild) nodes.push(clone.firstChild);
  richCopy(nodes, '본문');
});

document.getElementById('copyTitleBtn').addEventListener('click', async ()=>{
  if(!titleEl.value){ showToast('제목이 비어있습니다'); return; }
  try{
    await navigator.clipboard.writeText(titleEl.value);
    showToast('제목 복사 완료');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = titleEl.value;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
    showToast('제목 복사 완료');
  }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('작성한 내용을 모두 지울까요?')){
    titleEl.value = '';
    bodyEl.innerHTML = '';
    updateCount();
    localStorage.removeItem(STORAGE_KEY);
    saveDot.classList.remove('saved');
    saveStatusEl.textContent = '새 초안';
  }
});

loadDraft();
updateCount();
</script>
</body>
</html>

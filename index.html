<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 임시 작성</title>
<style>
  :root{
    --bg:#f7f5f0;
    --paper:#ffffff;
    --ink:#2b2b26;
    --sub:#8a8578;
    --accent:#3d6b4f;
    --line:#e4e0d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-size:18px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .savebar{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--sub);
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:#c4c0b3;
    transition:background .2s;
  }
  .dot.saved{background:var(--accent);}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
    overflow:hidden;
  }
  input#title{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    padding:16px 18px;
    font-size:17px;
    font-weight:700;
    outline:none;
    background:transparent;
  }
  input#title::placeholder{color:#c4c0b3;font-weight:600;}
  textarea#body{
    width:100%;
    min-height:420px;
    border:none;
    padding:16px 18px 20px;
    font-size:15px;
    line-height:1.75;
    outline:none;
    resize:vertical;
    font-family:inherit;
    background:transparent;
  }
  textarea#body::placeholder{color:#c4c0b3;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 18px;
    border-top:1px solid var(--line);
    background:#fbfaf7;
    font-size:12px;
    color:var(--sub);
  }
  .actions{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .primary{
    background:var(--accent);
    color:#fff;
  }
  .primary:hover{background:#325940;}
  .ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
  }
  .ghost:hover{background:#f0eee6;}
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:10px;
    line-height:1.6;
  }
  .imgsection{
    margin-top:18px;
  }
  .imgsection h2{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:22px;
    text-align:center;
    font-size:13px;
    color:var(--sub);
    background:var(--paper);
    cursor:text;
    transition:border-color .15s, background .15s;
  }
  .dropzone:focus{
    outline:none;
    border-color:var(--accent);
    background:#fbfaf7;
  }
  .dropzone.drag{
    border-color:var(--accent);
    background:#f0f6f2;
  }
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
    margin-top:12px;
  }
  .thumb{
    position:relative;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:#fff;
  }
  .thumb img{
    width:100%;
    height:100px;
    object-fit:cover;
    display:block;
  }
  .thumb .thumbbar{
    display:flex;
    justify-content:space-between;
    padding:5px 6px;
    background:#fbfaf7;
    border-top:1px solid var(--line);
  }
  .thumb .thumbbar button{
    padding:3px 7px;
    font-size:11px;
    border-radius:5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 블로그 임시 작성</h1>
    <div class="savebar"><span class="dot" id="saveDot"></span><span id="saveStatus">불러오는 중...</span></div>
  </header>

  <div class="card">
    <input id="title" placeholder="제목을 입력하세요">
    <textarea id="body" placeholder="여기에 본문을 작성하세요. 나중에 네이버 블로그에 복사해서 붙여넣으면 됩니다."></textarea>
    <div class="toolbar">
      <span id="count">0자</span>
      <span>이 브라우저에 자동 저장됩니다</span>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="copyBtn">전체 복사</button>
    <button class="ghost" id="copyTitleBtn">제목만 복사</button>
    <button class="ghost" id="copyBodyBtn">본문만 복사</button>
    <button class="ghost" id="clearBtn">내용 지우기</button>
  </div>

  <p class="hint">이 저장은 <b>지금 사용 중인 브라우저에만</b> 남습니다. 다른 PC·폰에서는 보이지 않으니, 다 쓰신 뒤에는 꼭 "전체 복사"를 눌러 네이버 블로그에 옮겨 붙여넣으세요.</p>

  <div class="imgsection">
    <h2>🖼 캡처 이미지</h2>
    <div class="dropzone" id="dropzone" tabindex="0">여기를 클릭한 뒤 <b>Ctrl+V</b>로 캡처한 이미지를 붙여넣으세요</div>
    <div class="gallery" id="gallery"></div>
    <p class="hint">이미지도 이 브라우저에만 저장됩니다. 퇴근 전에 이미지마다 "다운로드" 버튼을 눌러 파일로 받아두시면, 집에서 네이버 블로그 에디터에 파일을 업로드하시면 됩니다.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const countEl = document.getElementById('count');
const saveStatusEl = document.getElementById('saveStatus');
const saveDot = document.getElementById('saveDot');
const toastEl = document.getElementById('toast');
const STORAGE_KEY = 'blog-draft-v1';

function updateCount(){
  countEl.textContent = bodyEl.value.length.toLocaleString() + '자';
}

let saveTimer = null;
function scheduleSave(){
  saveDot.classList.remove('saved');
  saveStatusEl.textContent = '저장 중...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 400);
}

function saveDraft(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      title: titleEl.value,
      body: bodyEl.value,
      updatedAt: Date.now()
    }));
    saveDot.classList.add('saved');
    saveStatusEl.textContent = '저장됨';
  }catch(e){
    saveStatusEl.textContent = '저장 실패';
  }
}

function loadDraft(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      titleEl.value = data.title || '';
      bodyEl.value = data.body || '';
      updateCount();
      saveDot.classList.add('saved');
      saveStatusEl.textContent = '저장된 초안 불러옴';
    }else{
      saveStatusEl.textContent = '새 초안';
    }
  }catch(e){
    saveStatusEl.textContent = '새 초안';
  }
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

async function copyText(text, label){
  if(!text){ showToast('복사할 내용이 없습니다'); return; }
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    fallbackCopy(text);
  }
  showToast(label + ' 복사 완료');
}

bodyEl.addEventListener('input', ()=>{ updateCount(); scheduleSave(); });
titleEl.addEventListener('input', scheduleSave);

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const full = (titleEl.value ? titleEl.value + '\n\n' : '') + bodyEl.value;
  copyText(full, '전체');
});
document.getElementById('copyTitleBtn').addEventListener('click', ()=> copyText(titleEl.value, '제목'));
document.getElementById('copyBodyBtn').addEventListener('click', ()=> copyText(bodyEl.value, '본문'));
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('작성한 내용을 모두 지울까요?')){
    titleEl.value=''; bodyEl.value=''; updateCount();
    localStorage.removeItem(STORAGE_KEY);
    saveDot.classList.remove('saved');
    saveStatusEl.textContent = '새 초안';
  }
});

loadDraft();
updateCount();

// ---- 이미지 붙여넣기 기능 ----
const dropzone = document.getElementById('dropzone');
const gallery = document.getElementById('gallery');
const IMG_KEY = 'blog-draft-images-v1';
let images = [];

function loadImages(){
  try{
    const raw = localStorage.getItem(IMG_KEY);
    images = raw ? JSON.parse(raw) : [];
  }catch(e){ images = []; }
  renderGallery();
}

function saveImages(){
  try{
    localStorage.setItem(IMG_KEY, JSON.stringify(images));
  }catch(e){
    showToast('이미지 저장 공간이 부족해요. 몇 개를 다운로드 후 삭제해주세요.');
  }
}

function renderGallery(){
  gallery.innerHTML = '';
  images.forEach((img, idx)=>{
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `
      <img src="${img.data}" alt="캡처 이미지 ${idx+1}">
      <div class="thumbbar">
        <button class="ghost" data-act="dl" data-idx="${idx}">다운로드</button>
        <button class="ghost" data-act="del" data-idx="${idx}">삭제</button>
      </div>`;
    gallery.appendChild(div);
  });
}

gallery.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if(btn.dataset.act === 'dl'){
    const a = document.createElement('a');
    a.href = images[idx].data;
    a.download = `capture-${idx+1}.png`;
    a.click();
  }else if(btn.dataset.act === 'del'){
    images.splice(idx,1);
    saveImages();
    renderGallery();
  }
});

function handlePasteEvent(e){
  const items = (e.clipboardData || window.clipboardData)?.items;
  if(!items) return;
  let found = false;
  for(const item of items){
    if(item.kind === 'file' && item.type.startsWith('image/')){
      found = true;
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ()=>{
        images.push({ data: reader.result, addedAt: Date.now() });
        saveImages();
        renderGallery();
        showToast('이미지 추가됨');
      };
      reader.readAsDataURL(file);
    }
  }
  if(found) e.preventDefault();
}

document.addEventListener('paste', (e)=>{
  const items = (e.clipboardData || window.clipboardData)?.items;
  if(!items) return;
  for(const item of items){
    if(item.kind === 'file' && item.type.startsWith('image/')){
      handlePasteEvent(e);
      break;
    }
  }
});

loadImages();

</script>
</body>
</html>
